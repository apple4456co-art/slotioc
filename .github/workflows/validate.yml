name: Validate Affiliate AutoPilot
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile desktop and mobile modules
        run: python -m py_compile app.py mobile_hub.py
      - name: Run core application self-test
        run: python app.py --self-test
